[
  {
    "service_name": "ros1-dynamic-bridge.service",
    "purpose": "Runs ros1_bridge dynamic_bridge to forward ROS 1 topics from 10.25.25.115:11311 into ROS 2 under the authoritative split-service architecture.",
    "related_files": [
      "/etc/systemd/system/ros1-dynamic-bridge.service"
    ],
    "verification_commands": [
      "systemctl status ros1-dynamic-bridge.service --no-pager -l",
      "ps -ef | grep dynamic_bridge | grep -v grep",
      "env -i HOME=/home/swu USER=swu LOGNAME=swu PATH=/usr/sbin:/usr/bin:/sbin:/bin sudo -u swu /bin/bash -lc \"source /opt/ros/foxy/setup.bash; ros2 topic list -t\""
    ],
    "restart_commands": [
      "sudo systemctl restart ros1-dynamic-bridge.service"
    ]
  },
  {
    "service_name": "rosbridge-websocket.service",
    "purpose": "Exposes ROS 2 topics to websocket clients on ws://10.25.25.107:9090 and must be the only intended owner of port 9090.",
    "related_files": [
      "/etc/systemd/system/rosbridge-websocket.service"
    ],
    "verification_commands": [
      "systemctl status rosbridge-websocket.service --no-pager -l",
      "ss -ltnp | grep 9090",
      "ps -ef | grep rosbridge | grep -v grep",
      "journalctl -u rosbridge-websocket.service --no-pager -l | tail -n 40"
    ],
    "restart_commands": [
      "sudo systemctl restart rosbridge-websocket.service"
    ]
  },
  {
    "service_name": "rosbridge-topic-advertiser.service",
    "purpose": "Advertises browser-consumed topic names and types into the ROS 2 graph so rosbridge can resolve untyped subscribe requests.",
    "related_files": [
      "/etc/systemd/system/rosbridge-topic-advertiser.service",
      "/home/swu/bridge_support/ros2_topic_advertiser.py"
    ],
    "verification_commands": [
      "systemctl status rosbridge-topic-advertiser.service --no-pager -l",
      "env -i HOME=/home/swu USER=swu LOGNAME=swu PATH=/usr/sbin:/usr/bin:/sbin:/bin sudo -u swu /bin/bash -lc \"source /opt/ros/foxy/setup.bash; ros2 topic list -t | egrep '/robot/amcl_pose|/robot/robotnik_base_control/odom'\""
    ],
    "restart_commands": [
      "sudo systemctl restart rosbridge-topic-advertiser.service",
      "sudo systemctl restart rosbridge-websocket.service"
    ]
  },
  {
